name: showhaus amenities build
# Runs where OpenStreetMap's Overpass API is reachable; commits dist/showhaus/data/amenities.json to the branch it ran on.
on:
  workflow_dispatch:
  push:
    paths: ['scripts/showhaus_build_amenities.py', '.github/workflows/showhaus-amenities.yml']
  schedule:
    - cron: '41 4 1 */3 *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/showhaus_build_amenities.py
      - name: Commit when changed
        run: |
          git diff --quiet -- dist/showhaus/data/amenities.json 2>/dev/null && git ls-files --error-unmatch dist/showhaus/data/amenities.json >/dev/null 2>&1 && { echo "no change"; exit 0; }
          git config user.name "showhaus-data"; git config user.email "showhaus@users.noreply.github.com"
          git add dist/showhaus/data/amenities.json && git commit -m "data: SHOWHAUS per-postcode amenity measures" && git push origin HEAD:${GITHUB_REF_NAME}
